name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ProEstimate AI/**"
      - "ProEstimate AI.xcodeproj/**"
      - "scripts/tests/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ProEstimate AI/**"
      - "ProEstimate AI.xcodeproj/**"
      - "scripts/tests/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Match TestFlight's Xcode 26 toolchain. The runner's default
          # Xcode 16 does not support the app's default actor isolation
          # setting or iOS 26 SDK.
          xc=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1) || true
          if [ -z "$xc" ]; then
            echo "::error::No Xcode 26.x found on runner."
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          echo "Selecting $xc"
          sudo xcode-select -s "$xc"

      - name: Show tool versions
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild \
            -project "ProEstimate AI.xcodeproj" \
            -scheme "ProEstimate AI" \
            -resolvePackageDependencies

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project "ProEstimate AI.xcodeproj" \
            -scheme "ProEstimate AI" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        if: hashFiles('ProEstimate AI/**/*Tests.swift') != ''
        run: |
          set -o pipefail
          xcodebuild \
            -project "ProEstimate AI.xcodeproj" \
            -scheme "ProEstimate AI" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Run model and pagination regressions
        run: scripts/tests/run-ios-regressions.sh

      - name: Run Home state regressions
        run: scripts/tests/run-dashboard-regressions.sh

      - name: Run project setup navigation regressions
        run: scripts/tests/run-project-creation-navigation.sh

      - name: Run manual estimate editing regressions
        run: scripts/tests/run-estimate-editor-regressions.sh

      - name: Run direct estimate creation regressions
        run: scripts/tests/run-estimate-creation-regressions.sh

      - name: Run estimate delivery regressions
        run: scripts/tests/run-estimate-delivery-regressions.sh

      - name: Run protected draft recovery regressions
        run: scripts/tests/run-estimate-draft-recovery.sh

      - name: Run invoice finance regressions
        run: scripts/tests/run-invoice-finance-regressions.sh

      - name: Run invoice currency regressions
        run: scripts/tests/run-invoice-currency-regressions.sh

      - name: Run customer payment setup regressions
        run: scripts/tests/run-customer-payment-settings-regressions.sh

      - name: Run saved estimate library regressions
        run: scripts/tests/run-estimate-library-regressions.sh

      - name: Run contractor price review regressions
        run: scripts/tests/run-estimate-price-review-regressions.sh

      - name: Run proposal and follow-up regressions
        run: scripts/tests/run-proposal-followup-regressions.sh

      - name: Run approved change-order regressions
        run: scripts/tests/run-change-order-regressions.sh

      - name: Run job cost and receipt regressions
        run: scripts/tests/run-job-cost-regressions.sh
